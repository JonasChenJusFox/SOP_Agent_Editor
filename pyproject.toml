[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "admissions-editor-agent"
version = "0.3.0"
description = "Evidence-anchored review workflow for admissions essays"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18,<5"]

[project.scripts]
admissions-editor = "admissions_editor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
admissions_editor = ["review.schema.json", "knowledge.schema.sql", "revision_prompts/*.md", "revision_prompts/*.json", "revision_prompts/licenses/*.txt", "web/*.html", "web/*.css", "web/*.js", "web/vendor/*.js", "web/vendor/*.mjs", "web/vendor/*.txt", "web/vendor/*.json", "web/vendor/pdfjs/cmaps/*", "web/vendor/pdfjs/standard_fonts/*"]
